framework:
    messenger:
        # One Messenger bus per message type. somework_cqrs.yaml points the CQRS buses at them.
        default_bus: command.bus
        buses:
            # Each handler runs in a transaction, and the entity manager is flushed when it returns:
            # the events its entities recorded are stored in the outbox in that transaction.
            command.bus:
                middleware: [doctrine_transaction]
            query.bus: ~
            # The event handlers the relay runs write the activity read model in their own transaction.
            event.bus:
                middleware: [doctrine_transaction]

        transports:
            # The relay sends the stored events here: their handlers run in the relay's process.
            # Use a real transport (e.g. 'doctrine://default' or '%env(MESSENGER_TRANSPORT_DSN)%')
            # and "php bin/console messenger:consume" to handle them in a worker instead.
            events: 'sync://'
