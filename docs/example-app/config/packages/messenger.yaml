framework:
    messenger:
        # One Messenger bus per message type. somework_cqrs.yaml points the CQRS buses at them.
        default_bus: command.bus
        buses:
            command.bus: ~
            query.bus: ~
            event.bus: ~
            # Asynchronous buses (see the async example in somework_cqrs.yaml):
            # command.async_bus: ~
            # event.async_bus: ~

        # Asynchronous delivery. The demo runs everything synchronously, so no transport is
        # needed. "in-memory://" keeps messages in the PHP process (handy for tests); use a real
        # DSN such as 'doctrine://default' or '%env(MESSENGER_TRANSPORT_DSN)%' in production and
        # run a worker with "php bin/console messenger:consume async".
        # transports:
        #     async: 'in-memory://'
