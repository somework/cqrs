# somework/cqrs-bundle configuration.
# Full reference: php bin/console config:dump-reference somework_cqrs
somework_cqrs:
    # Messenger buses behind CommandBus, QueryBus and EventBus (defined in messenger.yaml).
    buses:
        command: command.bus
        query: query.bus
        event: event.bus

    # Mode used by dispatch() when no explicit DispatchMode is passed. Queries are always sync.
    # Events recorded by entities always go through the outbox, whatever the mode says.
    dispatch_modes:
        command:
            default: sync
        event:
            default: sync

    # Where the relay sends the events stored in the outbox (Messenger transport names).
    transports:
        event_async:
            default: [events]

    # The transactional outbox, on the connection of the entity manager. "doctrine:schema:create"
    # creates its table with the others (or run "somework:cqrs:outbox:setup").
    outbox:
        enabled: true
        # For development: relay right after each command instead of running the relay yourself.
        # relay_on_terminate: true

    # The events the Task entity records are stored in the outbox when the entity manager flushes.
    doctrine_events:
        enabled: true

    # Per-message retry policies (the service is defined in services.yaml) and the transport-level
    # retry strategy that applies them when a message consumed from a transport fails:
    # retry_policies:
    #     command:
    #         map:
    #             App\Task\Command\CreateTask: app.retry.exponential
    # retry_strategy:
    #     transports:
    #         async: command
    #     jitter: 0.1
    #     max_delay: 60000

    # IdempotencyStamp deduplication is enabled by default but only takes effect with
    # symfony/messenger 7.3+, symfony/lock and framework.lock; without them the stamp is ignored.
    # idempotency:
    #     ttl: 300
